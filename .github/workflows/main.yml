on: [push]
 
jobs:   
  soos_sast_analysis_example:
      permissions:
         security-events: write # for uploading code scanning alert info
         actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      name: SOOS SAST Analysis Example
      runs-on: ubuntu-latest
      steps:
        - uses: actions/setup-node@v4
          with:
            node-version: 20
        - uses: actions/checkout@master
        - name: Run SOOS SAST Analysis
          uses: soos-io/soos-sast-github-action@v1.3.0  #GET Latest Version from https://github.com/marketplace/actions/soos-sast
          with:
            client_id: ${{ secrets.SOOS_CLIENT_ID }}
            api_key: ${{ secrets.SOOS_API_KEY }}
            api_url: https://qa-api.soos.io/api/
            project_name: "SAST-githubActions"
            sast_version: 1.0.12-pre.1
            log_level: DEBUG
            #source_code_path: "projectB/sarif-files"
            export_format: SARIF
            export_file_type: JSON 
            output_directory: output

        # Cargar el directorio generado como artefacto
        - uses: actions/upload-artifact@v4
          with:
            name: sast-analysis-output
            path: |
                ${{ github.workspace }}/output/*.cdx.json
                ${{ github.workspace }}/output/*.cdx.xml
                ${{ github.workspace }}/output/*.spdx.json
                ${{ github.workspace }}/output/*.spdx.txt
                ${{ github.workspace }}/output/*.sarif.json
                ${{ github.workspace }}/output/*.csafvex.json
                ${{ github.workspace }}/output/*.sooslicenses.hmtl
                ${{ github.workspace }}/output/*.sooslicenses.csv
                ${{ github.workspace }}/output/*.soospackages.hmtl
                ${{ github.workspace }}/output/*.soospackages.csv
                ${{ github.workspace }}/output/*.soosvulnerabilities.hmtl
                ${{ github.workspace }}/output/*.soosvulnerabilities.csv
                ${{ github.workspace }}/output/*.soosissues.hmtl
                ${{ github.workspace }}/output/*.soosissues.csv

        - name: Get SARIF file
          id: get-sarif
          run: |
            FILE=$(ls ${{ github.workspace }}/output/*.sarif.json | head -n 1)
            echo "sarif_file=$FILE" >> $GITHUB_ENV

        - name: Upload SOOS SARIF Report
          uses: github/codeql-action/upload-sarif@v3
          with:
              sarif_file: ${{ env.sarif_file }}
